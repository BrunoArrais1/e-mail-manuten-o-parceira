<!DOCTYPE html>
<html>
<head>
    <title>Busca Contatos FUST</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f5f5f5;
            margin: 0;
        }

        header {
            background-color: #6a00a8;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 3px 10px rgba(0,0,0,0.2);
        }

        h3 {
            color: #6a00a8;
        }

        select, input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #6a00a8;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #7e1ac7;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tabs button {
            flex: 1;
            background-color: #ddd;
            color: black;
        }

        .tabs button.active {
            background-color: #6a00a8;
            color: white;
        }

        .resultado {
            margin-top: 15px;
            background: #f0e6ff;
            padding: 15px;
            border-radius: 8px;
        }

        .carimbo {
            border-left: 5px solid #6a00a8;
            padding-left: 10px;
        }
    </style>

</head>

<body>

<div style="margin-bottom:20px;">

    <a href="index.html"
       style="
            background:#660099;
            color:white;
            text-decoration:none;
            padding:12px 18px;
            border-radius:8px;
            font-weight:bold;
            display:inline-block;
       ">

        🏠 Voltar ao Portal

    </a>

</div>

<header>
    BUSCA - CONTATOS EDUCAÇÃO - PROJETO FUST
</header>

<div class="container">
    <div class="box">

        <!-- BOTÕES -->
        <div class="tabs">
            <button id="btnMun" class="active" onclick="mostrarAba('mun')">Município</button>
            <button id="btnInep" onclick="mostrarAba('inep')">INEP</button>
        </div>

        <!-- ABA MUNICIPIO -->
        <div id="abaMunicipio">

            <h3>Buscar por Município</h3>

            <select id="municipio">
                <option>Carregando municípios...</option>
            </select>

            <button onclick="buscarMunicipio()">Buscar</button>

            <div id="resMun" class="resultado"></div>
        </div>

        <!-- ABA INEP -->
        <div id="abaINEP" style="display:none;">

            <h3>Buscar por INEP</h3>

            <input id="inep" class="campo-inep" placeholder="Digite o código INEP">

        .campo-inep{
    width:300px;
    max-width:100%;
    margin:auto;
    display:block;
}
            <button onclick="buscarINEP()">Buscar</button>

            <div id="resINEP" class="resultado"></div>
        </div>

    </div>
</div>

<script>

let baseMunicipio = [];
let baseINEP = [];

document.addEventListener("DOMContentLoaded", async () => {

    try {

        const municipiosResp =
            await fetch("./municipios.json");

        baseMunicipio =
            await municipiosResp.json();

        const inepResp =
            await fetch("./inep.json");

        baseINEP =
            await inepResp.json();

        carregarMunicipios();

    } catch (erro) {

        console.error(erro);

        alert("Erro ao carregar as bases JSON");

    }

});

function carregarMunicipios() {

    let select =
        document.getElementById("municipio");

    select.innerHTML =
        '<option value="">Selecione o município</option>';

    let municipios =
        [...new Set(
            baseMunicipio.map(x => x["MUNICIPIO"])
        )];

    municipios.sort();

    municipios.forEach(m => {

        let option =
            document.createElement("option");

        option.value = m;
        option.textContent = m;

        select.appendChild(option);

    });

}

function mostrarAba(tipo) {

    let abaMun =
        document.getElementById("abaMunicipio");

    let abaInep =
        document.getElementById("abaINEP");

    let btnMun =
        document.getElementById("btnMun");

    let btnInep =
        document.getElementById("btnInep");

    if(tipo === "mun") {

        abaMun.style.display = "block";
        abaInep.style.display = "none";

        btnMun.classList.add("active");
        btnInep.classList.remove("active");

    } else {

        abaMun.style.display = "none";
        abaInep.style.display = "block";

        btnMun.classList.remove("active");
        btnInep.classList.add("active");

    }

}

function buscarMunicipio() {

    let municipio =
        document.getElementById("municipio").value;

    let registro =
        baseMunicipio.find(
            x => x["MUNICIPIO"] === municipio
        );

    let div =
        document.getElementById("resMun");

    if (!registro) {

        div.innerHTML =
            "Município não localizado.";

        return;
    }

    div.innerHTML = `
        <b>Secretário:</b> ${registro["SECRETARIO"]}<br>
        <b>Email:</b> ${registro["E-MAIL"]}
    `;

}

function buscarINEP() {

    let inep =
        document.getElementById("inep").value.trim();

    let registro =
        baseINEP.find(
            x => String(x["INEP"]) === String(inep)
        );

    let div =
        document.getElementById("resINEP");

    if (!registro) {

        div.innerHTML =
            "INEP não localizado.";

        return;
    }

    div.innerHTML = `
        <b>Nome da Escola:</b> ${registro["NOME ESCOLA"]}<br>
        <b>Responsável:</b> ${registro["NOME RESPONSÁVEL"]}<br>
        <b>Email:</b> ${registro["EMAIL INSTITUICAO"]}<br>
        <b>Telefone:</b> ${registro["TELEFONE INSTITUIÇÃO"]}
    `;

}

</script>

</body>
</html>
