<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Busca Contatos FUST</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
}

header{
    background:#660099;
    color:white;
    padding:15px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

.container{
    max-width:700px;
    margin:40px auto;
}

.box{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0px 3px 10px rgba(0,0,0,.2);
}

h3{
    color:#660099;
}

select,
input{
    width:100%;
    padding:10px;
    margin:10px 0;
    border-radius:6px;
    border:1px solid #ccc;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    background:#660099;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#7e1ac7;
}

.tabs{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

.tabs button{
    flex:1;
    background:#ddd;
    color:black;
}

.tabs button.active{
    background:#660099;
    color:white;
}

.resultado{
    margin-top:15px;
    background:#f0e6ff;
    padding:15px;
    border-radius:8px;
    text-align:left;
}

.topo{
    padding:15px;
}

.btn-voltar{
    background:#660099;
    color:white;
    text-decoration:none;
    padding:12px 18px;
    border-radius:8px;
    font-weight:bold;
    display:inline-block;
}

.btn-voltar:hover{
    background:#7e1ac7;
}

#abaINEP{
    text-align:center;
}

.campo-inep{
    width:600px;
    max-width:100%;
    margin:auto;
    display:block;
}

.btn-buscar{
    width:220px;
    margin:15px auto;
    display:block;
}

</style>

</head>

<body>

<div class="topo">

    <a href="index.html" class="btn-voltar">
        🏠 Voltar ao Portal
    </a>

</div>

<header>
    BUSCA - CONTATOS
