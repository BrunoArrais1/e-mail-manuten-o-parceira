<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitação de Manutenção FUST</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: auto;
            padding: 20px;
            background: #f5f5f5;
        }

        h1 {
            color: #0078D4;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        textarea {
            height: 120px;
        }

        button {
            background: #0078D4;
            color: white;
            border: none;
            padding: 12px 20px;
            margin-top: 15px;
            cursor: pointer;
            border-radius: 4px;
        }

        button:hover {
            background: #005ea6;
        }

        .readonly {
            background-color: #eaeaea;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 8px;
        }
    </style>
</head>

    <script>

        async function buscarINEP() {

            const inep = document.getElementById("inep").value.trim();

            if (!inep) {
                alert("Informe o INEP");
                return;
            }

            try {

                const resposta = await fetch("dados.json");

                const base = await resposta.json();

                const registro = base.find(
                    item => String(item.inep) === String(inep)
                );

                if (!registro) {
                    alert("INEP não encontrado.");
                    return;
                }

                document.getElementById("parceira").value =
                    registro.parceira || "";

                document.getElementById("escola").value =
                    registro.escola || "";

                document.getElementById("idvivo").value =
                    registro.id || "";

            }
            catch (erro) {

                console.error(erro);

                alert(
                    "Erro ao carregar dados.json"
                );

            }

        }
