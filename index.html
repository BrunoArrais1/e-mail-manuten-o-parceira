<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<title>Portal Operacional FUST</title>

<style>

body{
    font-family: Segoe UI, Arial;
    background:#f5f5f5;
    margin:0;
    padding:35px;
}

h1{
    text-align:center;
    color:#660099;
}

.container{
    max-width:1200px;
    margin:auto;
}

.card{
    width: fit-content;
    background:white;
    margin-top:15px;
    padding:20px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
    display:block;
}

.card:hover{
    transform:translateY(-3px);
}

.card a{
    text-decoration:none;
    color:#660099;
    font-size:23px;
    font-weight:bold;
    display:block;
}
.tema-container{
    position:fixed;
    top:20px;
    right:20px;
    z-index:1000;
}

#temaBtn{
    width:160px;
    height:45px;
    background:#660099;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    font-size:14px;
}

#temaBtn:hover{
    background:#7e1ac7;
}
``
#temaBtn{
    background:#660099;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

#temaBtn:hover{
    background:#7e1ac7;
}

/* TEMA ESCURO */

body.dark{
    background:#1e1e1e;
    color:white;
}

body.dark h1{
    color:white;
}

body.dark .card{
    background:#2b2b2b;
}

body.dark .card a{
    color:white;
}
</style>

</head>

<body>

<div class="tema-container">
    <button id="temaBtn" onclick="alternarTema()">
        🌙 Modo Escuro
    </button>
</div>

<div class="container">

<h1>Portal Operacional FUST</h1>

<div class="card">
    <a href="email.html">
        📧 Gerador de E-mail
    </a>
</div>

<div class="card">
    <a href="carimbos.html">
        📋 Gerador de Carimbos
    </a>
</div>

<div class="card">
    <a href="contatos.html">
        📞 Busca de Contatos
    </a>
</div>

</div>
<script>

function alternarTema(){

    document.body.classList.toggle("dark");

    const escuro =
        document.body.classList.contains("dark");

    localStorage.setItem(
        "tema",
        escuro ? "dark" : "light"
    );

    document.getElementById("temaBtn").innerHTML =
        escuro
        ? "☀️ Modo Claro"
        : "🌙 Modo Escuro";

}

window.onload = function(){

    const tema =
        localStorage.getItem("tema");

    if(tema === "dark"){

        document.body.classList.add("dark");

        document.getElementById("temaBtn").innerHTML =
            "☀️ Modo Claro";

    }

};

</script>
</body>

</html>
