<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<title>Login - Portal Operacional FUST</title>

<style>

body{
    background:#f5f5f5;
    font-family:Segoe UI, Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{

    width:400px;

    background:white;

    padding:30px;

    border-radius:15px;

    box-shadow:0 5px 20px rgba(0,0,0,.2);

}

h2{
    text-align:center;
    color:#660099;
}

input{

    width:100%;

    padding:12px;

    margin-bottom:15px;

    border:1px solid #ccc;

    border-radius:6px;

    box-sizing:border-box;

}

button{

    width:100%;

    padding:12px;

    border:none;

    border-radius:6px;

    background:#660099;

    color:white;

    font-weight:bold;

    cursor:pointer;

}

button:hover{
    background:#7e1ac7;
}

</style>

</head>

<body>

<div class="login-box">

    <h2>Portal Operacional FUST</h2>

    <input
        type="text"
        id="usuario"
        placeholder="Usuário">

    <input
        type="password"
        id="senha"
        placeholder="Senha">

    <button onclick="login()">
        Entrar
    </button>

</div>

<script>

function login(){

    const usuario =
        document.getElementById("usuario").value;

    const senha =
        document.getElementById("senha").value;

    if(
        usuario === "bruno" &&
        senha === "Fust2026!"
    ){

        localStorage.setItem(
            "usuarioLogado",
            usuario
        );

        window.location.href =
            "index.html";

    }else{

        alert(
            "Usuário ou senha inválidos."
        );

    }

}

</script>

</body>

</html>
